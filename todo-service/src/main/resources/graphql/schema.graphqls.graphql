type TaskList {
    id: ID
    username: String
    creationDate: String
    title: String
    tasks: [Task]
}

type Task {
    id: ID
    username: String
    title: String
    taskDescription: String
    completed: Boolean
    creationDate: String
    dueDate: String
    completionDate: String # New field
}

input TaskInput {
    id: ID
    username: String!
    title: String!
    taskDescription: String
    completed: Boolean!
    dueDate: String!
    completionDate: String # New field
}




type Query {
    getAllTaskLists: [TaskList]
    getTaskListById(id: ID): TaskList
    getTaskListsByUsername(username: String!): [TaskList]

    # Sorting methods
    getTaskListsSortedByCreationDateAsc(username: String!): [TaskList]
    getTaskListsSortedByCreationDateDesc(username: String!): [TaskList]
    getTaskListsSortedByTaskCountAsc(username: String!): [TaskList]
    getTaskListsSortedByTaskCountDesc(username: String!): [TaskList]
}

type Mutation {
    createTaskList(username: String!, title: String!): TaskList
    createTaskListWithTasks(username: String!, title: String!, tasks: [TaskInput!]!): TaskList

    addTasksToTaskList(taskListId: ID!, tasks: [TaskInput!]!): TaskList

    updateTaskList(taskListId: ID!,username: String!,creationDate: String!,title:String!,tasks: [TaskInput!]!): TaskList

    deleteTaskList(taskListId: ID!): Boolean # New mutation
    deleteTasksFromTaskList(taskListId: ID!, taskIds: [ID!]!): TaskList

    toggleTaskCompletion(taskListId: ID!, taskId: ID!, isCompleted: Boolean!): Task

    updateTaskDetails(taskListId: ID!,taskId: ID!,title: String,description: String,dueDate: String): Task
    updateTaskListTitle(taskListId: ID!,title: String!): TaskList
}